services:
  postgres:
    image: postgres:18-alpine
    container_name: budgeteer-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME not set in .env}
      POSTGRES_USER: ${DB_USER:?DB_USER not set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD not set in .env}
    # Audit-friendly logging: every connection and disconnection is recorded,
    # so any future incident has a clear trail (who connected, when, from where).
    command:
      - postgres
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_hostname=on
    ports:
      - "127.0.0.1:5432:5432"   # localhost only — never expose Postgres to the network
    volumes:
      # postgres:18 moved PGDATA under /var/lib/postgresql/18/... — mount the parent so the
      # named volume actually holds the data (the old /var/lib/postgresql/data target left it
      # in an anonymous volume that died on every container recreate)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
